S=Object.assign({sess:[],mast:{},songs:[],res:{},plan:[],pf:null},S||{});S.n=S.n||5;S.songs.forEach((s,i)=>s.id=s.id||'s'+i+Date.now().toString(36));const save=()=>{try{localStorage[K]=JSON.stringify(S)}catch(e){}};

/* ---------- Théorie & manche (4, 5 ou 6 cordes) ---------- */
const BASE5=[23,28,33,38,43],TUN={4:[28,33,38,43],5:[23,28,33,38,43],6:[23,28,33,38,43,48]},NN=['Do','Do#','Ré','Mib','Mi','Fa','Fa#','Sol','Lab','La','Sib','Si'];

function parse(g){let ps=-1;g.p=g.n.split(' ').map(t=>{const p=t[0]=='~';if(p)t=t.slice(1);let o;
if(/^\d:/.test(t)){const[s,f]=t.split(':').map(Number),i=OPEN.indexOf(BASE5[s]);o=i>=0?{s:i,f,m:OPEN[i]+f}:place1(BASE5[s]+f,f,ps)}else o=place1(nm(t),g.a||0,ps);
if(!o)return null;ps=o.s;return Object.assign({},o,{p})}).filter(Boolean);g.rt=g.r&&nm(g.r)>=OPEN[0]?nm(g.r):g.p[0].m;return g}
const G=(l,n,a,r)=>{const g={l,n,a,r};ALLG.push(g);return parse(g)},S_=(t,m,x,g,b)=>({t,m,x,g,b:b||60}),R_=(l,rhy,n,lab,a)=>{const g={l,n,a:a||0,rhy,lab};ALLG.push(g);return parse(g)};
const setInst=n=>{S.n=n;OPEN=TUN[n];SN=OPEN.map(m=>NN[m%12]);ALLG.forEach(parse);save()};
/* ---------- Parcours ---------- */
const DO=G('Do','C2 E2 G2 C3',3),AM=G('La mineur','A1 C2 E2 A2',0),FA=G('Fa','F1 A1 C2 F2',1),SO=G('Sol','G1 B1 D2 G2',3),PR=[DO,AM,FA,SO];

const L=[
{id:'1a',w:1,t:'Trouver les notes',d:'Le manche de ta 5 cordes',s:[

S_('Un Do, quatre endroits',4,'Une même note existe à plusieurs endroits. Retrouve tous les Do : c’est la clé pour ne plus se perdre sur le manche.',[G('Les Do du manche','2:3 1:8 4:5 3:10')],50)]},
{id:'1b',w:1,t:'Arpège majeur',d:'Fondamentale, tierce, quinte, octave',s:[

{id:'1c',w:1,t:'Arpège mineur',d:'Entendre la tierce mineure',s:[

{id:'1d',w:1,t:'Do – La mineur – Fa – Sol',d:'Ta première progression',s:[

const WHY={"1a": ["Jouer à l’oreille fonctionne tant que tu trouves vite la bonne note. Connaître le nom de chaque case t’évite de tâtonner et te laisse penser à la musique plutôt qu’au manche.", "Nommer n’importe quelle note du manche, la retrouver à plusieurs endroits et choisir la position la plus confortable.", "Partout : changer de tonalité au dernier moment, suivre une grille donnée par le pianiste ou le chef de chœur."], "1b": ["Un accord est un groupe de notes. L’arpège les joue l’une après l’autre : c’est la matière première d’une ligne de basse. Sans lui, on reste bloqué sur la fondamentale.", "Construire un accord majeur (fondamentale, tierce, quinte, octave) à partir de n’importe quelle note.", "Gospel et worship : lignes qui montent sur les accords majeurs. Afrobeat : motifs répétés sur 1 – 3 – 5."], "1c": ["Entre un accord majeur et un accord mineur, une seule note change : la tierce. C’est elle qui donne la couleur lumineuse ou sombre. La reconnaître t’aide aussi à deviner un accord à l’oreille.", "Passer d’un arpège majeur à son mineur en baissant la tierce d’un demi-ton, et entendre la différence.", "Soul, neo-soul, R&B et jazz : les accords mineurs portent l’émotion de ces styles."], "1d": ["Une notion isolée ne devient un réflexe qu’en la jouant sur une vraie progression. Do – La mineur – Fa – Sol est la base de centaines de chansons.", "Jouer la même progression de trois façons : racines, arpèges, puis ta propre version.", "Pop, gospel, worship : cette progression revient dans énormément de morceaux."], "2a": ["Les accords de septième ajoutent une quatrième note qui donne de la profondeur. En gospel, neo-soul et jazz, presque aucun accord n’est joué sans septième. Cette note te donne une couleur de plus pour varier.", "Reconnaître et jouer les arpèges maj7 et min7, et entendre leur ambiance douce ou chaude.", "Worship, neo-soul et jazz : les accords de septième sont leur vocabulaire de base."], "2b": ["Le dominant 7 crée une tension qui demande à être résolue : c’est le moteur des progressions. Savoir le repérer t’aide à sentir où va la musique.", "Jouer un arpège de dominant 7 et le relier à l’accord qui le résout.", "Blues, jazz et gospel traditionnel : il tire la musique vers l’accord suivant."], "2c": ["Les progressions en septièmes sont le décor du worship moderne et du neo-soul. L’enjeu est de relier les accords en douceur, au lieu de sauter d’une fondamentale à l’autre.", "Enchaîner quatre accords de septième avec des notes proches les unes des autres.", "Worship et neo-soul : presque chaque grille y ressemble à celle-ci."], "3a": ["Un arpège tout seul sonne vite mécanique. Les notes de passage comblent les trous entre les notes de l’accord et donnent à ta ligne un air de mélodie.", "Relier les notes d’un accord par des notes de passage placées sur les temps faibles.", "R&B, jazz et soul : leurs lignes de basse coulent grâce à ces petites notes."], "3b": ["Une note placée à un demi-ton de sa cible crée une petite tension qui se résout aussitôt. C’est l’un des gestes les plus utilisés par les bassistes pour faire sonner une ligne professionnelle.", "Arriver sur une note d’accord par un demi-ton, par le dessous ou par le dessus.", "Jazz, blues et gospel : en fin de mesure, pour lancer l’accord suivant."], "3c": ["Ce qui fait groover une ligne, c’est souvent la façon d’entrer dans l’accord suivant. Anticiper la fondamentale d’un demi-temps donne l’impression de pousser le morceau.", "Enchaîner deux accords sans à-coup et placer l’arrivée juste avant le temps.", "Afrobeat, gospel et funk : cette poussée crée le balancement du groove."], "4a": ["Créer, c’est choisir. En écrivant deux lignes différentes sur la même grille, tu constates qu’une progression ne dicte pas la ligne : c’est toi qui décides, et ton style se construit là.", "Inventer plusieurs lignes sur une même progression et expliquer ce qui les distingue.", "Dans tous tes styles : c’est ce qui sépare un bassiste qui répète d’un bassiste qui compose."], "4b": ["Le but n’est pas de réussir des exercices, mais de jouer ta musique. Une vraie chanson montre ce qui marche déjà et ce qui reste à travailler.", "Appliquer arpèges, notes de passage et anticipations sur un morceau de ton répertoire.", "Le répertoire que tu choisis : gospel, afro, R&B ou autre."], "s1": ["Une mauvaise posture fatigue la main et limite la précision. En posant bien la basse dès le départ, tu joues plus longtemps et plus proprement.", "Trouver une position stable, debout ou assis, avec des mains détendues.", "Partout : en répétition, à l’église ou en concert, une bonne posture te permet de jouer des heures."], "s2": ["Alterner deux doigts (index, majeur) donne un jeu régulier et rapide, sans fatigue. C’est la base de presque tous les grooves modernes.", "Jouer une note par temps, puis deux par temps, avec un toucher régulier.", "Gospel, afrobeat, funk : toutes les lignes rapides reposent sur cette alternance."], "s3": ["Une première ligne, même simple, donne du sens au reste : tu entends enfin comment la basse soutient une chanson.", "Jouer les fondamentales d’une progression à quatre accords, d’abord sur les temps, puis en croches.", "Pop, worship, gospel : une ligne de fondamentales est déjà une vraie ligne de basse."], "g1": ["La basse est autant rythmique qu’harmonique. Avant de choisir quelles notes jouer, il faut savoir où les placer dans le temps. Noires, croches et doubles croches sont ta base.", "Jouer la même note avec trois densités différentes en restant régulier.", "Tous les styles : c’est ce qui sépare une ligne qui flotte d’une ligne qui porte le groupe."], "g2": ["Le groove naît des notes qu’on ne joue pas autant que de celles qu’on joue. Décaler un coup ou laisser un silence crée le balancement.", "Placer des syncopes et des anticipations sur une grille à seize pas.", "Afrobeat (motif 3-3-2), gospel (anticipation avant le temps 1), R&B et neo-soul."], "g3": ["Les notes fantômes sont jouées très doucement : elles remplissent le rythme sans prendre de place. C’est ce qui donne la « poche » des bassistes de soul et de neo-soul.", "Alterner notes appuyées et notes fantômes pour une ligne qui respire.", "Neo-soul, R&B, funk : leur groove tient à ces petites notes."], "sc1": ["La pentatonique mineure n’a que cinq notes, toutes agréables ensemble : on peut y improviser sans craindre les fausses notes. C’est la gamme la plus utilisée à la basse.", "Jouer la pentatonique mineure sur une position et en tirer des fills.", "Blues, rock, R&B, gospel : presque tous les fills s’appuient dessus."], "sc2": ["La pentatonique majeure sonne plus lumineuse. Elle contient les mêmes notes que la pentatonique mineure de sa relative (Do majeur et La mineur) : deux gammes pour le prix d’une.", "Jouer la pentatonique majeure et la relier à sa mineure relative.", "Gospel, worship, pop : pour des lignes ouvertes et chantantes."], "sc3": ["La gamme majeure est le plan de toute la musique occidentale : accords, degrés et tonalités en découlent. La connaître explique pourquoi un accord fonctionne.", "Jouer la gamme majeure sur une position et nommer chaque degré.", "Tous les styles : c’est le point de départ de l’harmonie."], "sc4": ["La gamme blues ajoute une seule note à la pentatonique mineure : la quinte diminuée, la « blue note ». Cette note de tension donne sa couleur au blues.", "Jouer la gamme blues et utiliser la blue note comme note de passage.", "Blues, jazz, rock, soul : la blue note signe le style."], "h1": ["Presque toutes les chansons s’appuient sur trois accords : I, IV et V. Les reconnaître par leur degré plutôt que par leur nom te permet de les retrouver dans n’importe quelle tonalité.", "Jouer les accords I, IV et V en racines, puis en arpèges.", "Gospel, blues, pop, worship : la grille I – IV – V est partout."], "h2": ["La cadence ii – V – I est l’enchaînement le plus utilisé en jazz et en neo-soul. La reconnaître t’aide à anticiper la fin d’une phrase musicale.", "Jouer ii – V – I en arpèges de septième et relier les notes en douceur.", "Jazz, neo-soul, gospel moderne : elle revient dans presque chaque morceau."], "h3": ["Un chanteur change de tonalité, un pianiste joue autrement : tu dois pouvoir suivre. Transposer, c’est garder les mêmes formes et changer seulement le point de départ.", "Rejouer la grille I – IV – V dans une autre tonalité sans repartir de zéro.", "Chorale, scène, studio : changer de tonalité est quotidien pour un bassiste."]};L.forEach(l=>l.s.unshift({intro:1,t:'Comprendre la notion',m:1,x:'',g:[],b:60,w:WHY[l.id]}));

const idb=new Promise((res,rej)=>{const r=indexedDB.open('basslab',1);r.onupgradeneeded=()=>r.result.createObjectStore('a');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbp=(m,fn)=>idb.then(db=>new Promise((res,rej)=>{const q=fn(db.transaction('a',m).objectStore('a'));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}));
const aPut=(k,b)=>idbp('readwrite',s=>s.put(b,k)),aGet=k=>idbp('readonly',s=>s.get(k)),aDel=k=>idbp('readwrite',s=>s.delete(k));
let rec=null;const song=id=>S.songs.find(s=>s.id==id);
async function recStart(id){try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),mr=new MediaRecorder(st),ch=[];mr.ondataavailable=e=>e.data.size&&ch.push(e.data);
mr.onstop=async()=>{st.getTracks().forEach(t=>t.stop());await aPut(id,new Blob(ch,{type:mr.mimeType||'audio/mp4'}));song(id).a=1;save();rec=null;render();toast('Enregistrement ajouté')};
rec={id,mr,t0:Date.now()};mr.start();rec.iv=setInterval(()=>{const e=$('#rt'),s=Math.floor((Date.now()-rec.t0)/1000);if(e)e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},500);render()}catch(e){toast('Enregistrement impossible ici')}}
const recStop=()=>{if(rec){clearInterval(rec.iv);rec.mr.stop()}};
async function exportData(){const f=new File([JSON.stringify(S)],'basslab-sauvegarde.json',{type:'application/json'});
try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name=='AbortError')return}
const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}
/* ---------- Questions sur la notion (FAQ intégrée, sans internet) ---------- */
const FAQ={"1a": [["Pourquoi apprendre le nom des notes si je joue à l’oreille ?", "L’oreille te dit quoi jouer, le nom des notes te dit où le retrouver. Avec les deux, tu peux reprendre une idée dans une autre tonalité, parler le même langage qu’un pianiste ou noter ce que tu inventes."], ["Combien de demi-tons entre deux cases ?", "Chaque case monte d’un demi-ton, deux cases font un ton. Entre Mi et Fa, et entre Si et Do, il n’y a qu’un demi-ton : pas de note intermédiaire."], ["Comment retrouver l’octave d’une note ?", "Descends de deux cordes vers l’aigu et avance de deux cases. Exemple : Do à la case 3 de la corde de La devient Do à la case 5 de la corde de Sol."], ["Pourquoi la même note existe à plusieurs endroits ?", "Les cordes voisines se recoupent : la case 5 de la corde de La donne un Ré, comme la corde de Ré à vide. Choisir la position, c’est choisir le confort et la couleur du son."]], "1b": [["Qu’est-ce qu’un arpège ?", "C’est un accord joué note par note au lieu de toutes ensemble. À la basse, c’est la façon naturelle de faire entendre un accord."], ["Pourquoi 1 – 3 – 5 ?", "Ce sont les trois notes qui définissent un accord majeur : la fondamentale (le nom de l’accord), la tierce (qui dit majeur ou mineur) et la quinte (qui le stabilise)."], ["Comment trouver la tierce majeure ?", "Elle se trouve à 4 demi-tons de la fondamentale, donc 4 cases plus haut sur la même corde. De Do à Mi : Do, Do#, Ré, Mib, Mi."], ["Puis-je jouer les notes dans un autre ordre ?", "Oui, c’est même l’étape suivante. Garde la fondamentale sur le premier temps pour que l’accord reste clair, le reste est libre : 1 – 5 – 3 – 5, 1 – 3 – 5 – 3…"]], "1c": [["Quelle différence entre majeur et mineur ?", "Une seule note : la tierce. Majeure (4 demi-tons), l’accord sonne lumineux. Mineure (3 demi-tons), il sonne plus sombre ou plus triste."], ["Comment passer de majeur à mineur ?", "Baisse la tierce d’un demi-ton, c’est-à-dire d’une case. Do Mi Sol devient Do Mib Sol. La fondamentale et la quinte ne bougent pas."], ["Comment reconnaître majeur et mineur à l’oreille ?", "Joue l’arpège lentement et demande-toi si ça sonne ouvert ou fermé. Fais-le sur plusieurs accords : l’oreille apprend vite à faire la différence."], ["Pourquoi écrit-on Am pour La mineur ?", "Le « m » veut dire mineur. Un accord sans lettre en plus est majeur : C = Do majeur, Cm = Do mineur."]], "1d": [["Que veut dire jouer Do – La mineur – Fa – Sol ?", "Chaque accord dure une mesure de 4 temps et tu les enchaînes. Quand tu as fini Sol, tu reprends au début, comme dans une chanson."], ["Pourquoi commencer par les fondamentales ?", "Elles disent à tout le groupe sur quel accord on se trouve. Si elles sont solides, les arpèges et les variations ont un appui."], ["Comment trouver mon propre ordre de notes ?", "Garde les mêmes notes et change leur ordre, leur durée ou ajoute des silences. Essaie 1 – 5 – 3 – 5, puis 1 – 1 – 3 – 5, et compare."], ["Je perds le temps quand je change d’accord, que faire ?", "Joue lentement avec le métronome et prépare le changement un temps avant : pendant le dernier temps, regarde déjà la prochaine fondamentale."]], "2a": [["C’est quoi une septième ?", "Une quatrième note ajoutée au-dessus de la quinte. Maj7 = septième majeure (11 demi-tons au-dessus de la fondamentale), min7 = septième mineure (10 demi-tons)."], ["Quelle différence de couleur entre maj7 et min7 ?", "Maj7 est doux, ouvert, un peu rêveur. Min7 est chaud et plus détendu qu’un simple accord mineur. Les deux sont très présents en worship et en neo-soul."], ["Comment passer de Do à Do maj7 ?", "Garde Do – Mi – Sol et ajoute le Si, une case sous le Do de l’octave."], ["Faut-il toujours jouer la septième ?", "Non. À la basse, la fondamentale porte l’accord. La septième sert surtout de couleur, en fin de mesure ou sur un temps faible."]], "2b": [["Pourquoi « dominant » ?", "Parce qu’il est construit sur le cinquième degré de la gamme (le V). Sol est le V de Do : Sol 7 est donc le dominant 7 en Do majeur."], ["Quelle différence avec maj7 ?", "La septième est un demi-ton plus bas. Do maj7 = Do Mi Sol Si, Do 7 = Do Mi Sol Sib. Ce Sib crée la tension."], ["Pourquoi sent-on qu’il veut se résoudre ?", "Dans Sol 7, le Si et le Fa forment un intervalle instable (un triton) qui demande à se résoudre vers Do et Mi. L’oreille attend l’accord de Do."], ["Où l’entendre dans les chansons ?", "Dans presque tous les blues et le gospel traditionnel, souvent à la fin d’une phrase, juste avant de revenir à l’accord de départ."]], "2c": [["Qu’est-ce qui rend cette progression typique du worship ?", "Les accords de septième donnent un son doux et flottant, sans tension forte. Ils laissent de la place à la voix et aux nappes de clavier."], ["Comment relier deux accords en douceur ?", "Cherche la note du prochain accord la plus proche de celle où tu te trouves, à une ou deux cases près. Évite les grands sauts."], ["Faut-il jouer toutes les notes d’un arpège ?", "Non. En worship, une fondamentale tenue ou deux notes suffisent souvent. Joue ce que la chanson demande et laisse respirer."], ["Comment varier sans surcharger ?", "Change un seul élément à la fois : l’ordre des notes, le rythme ou une note de passage. Si tu changes tout, on n’entend plus l’accord."]], "3a": [["C’est quoi une note de passage ?", "Une note qui n’appartient pas à l’accord et que tu joues brièvement entre deux notes de l’accord pour les relier, en général sur un temps faible."], ["Pourquoi sur un temps faible ?", "Les temps forts sont ceux où l’accord doit s’entendre clairement. Sur un temps faible, une note étrangère à l’accord ne dérange pas."], ["Comment choisir la bonne note de passage ?", "Prends une note de la gamme située entre deux notes d’accord. Entre Do et Mi, le Ré fonctionne très bien."], ["Et si ça sonne faux ?", "Raccourcis la note et vérifie qu’elle mène bien à une note d’accord. Une note de passage qui reste trop longtemps devient une fausse note."]], "3b": [["Qu’est-ce qu’une approche chromatique ?", "Jouer, juste avant une note cible, la note située un demi-ton plus bas ou plus haut. Ça crée une petite tension qui se résout aussitôt."], ["Par dessous ou par dessus ?", "Les deux marchent. Par dessous est le plus courant et le plus simple : une case avant la cible, sur la même corde. Par dessus donne un son plus jazz."], ["Quelles notes viser ?", "D’abord les notes de l’accord, surtout la fondamentale de l’accord suivant. Plus la cible est forte, plus l’approche est convaincante."], ["Pourquoi ces notes « fausses » sonnent juste ?", "Parce qu’elles durent peu et se résolvent immédiatement. L’oreille entend une tension qui mène quelque part, pas une erreur."]], "3c": [["C’est quoi une anticipation ?", "Jouer la note du prochain accord un peu avant son temps, souvent sur le « et » du temps précédent. Ça donne l’impression de pousser la musique vers l’avant."], ["Comment enchaîner Do vers La mineur sans à-coup ?", "Termine la mesure sur une approche d’un demi-ton sous le La (le Sol#), puis tombe sur le La. Les deux accords se relient naturellement."], ["Quand éviter les anticipations ?", "Quand la musique est très posée ou quand le batteur joue un temps fort précis. Écoute la batterie et le chant avant d’anticiper."], ["Comment m’entraîner à anticiper ?", "Compte « 1 et 2 et 3 et 4 et » à voix haute, puis place la note d’arrivée sur le dernier « et ». Va doucement, puis monte le tempo."]], "4a": [["Comment varier sans perdre l’accord ?", "Garde la fondamentale sur le premier temps de chaque accord. Le reste (ordre, rythme, notes de passage) est libre."], ["Quelle différence entre les lignes A et B ?", "La ligne A est simple et s’appuie sur les notes d’accord. La ligne B ajoute des notes de passage et des rythmes décalés. Elles disent la même chose avec plus ou moins de mouvement."], ["Combien de notes jouer par mesure ?", "Autant que la chanson le permet. Dans un morceau calme, deux ou trois notes suffisent. Plus c’est dense, plus le rythme doit être précis."], ["Comment trouver mes propres idées ?", "Pars de la ligne A, change une seule chose, écoute, recommence. Enregistre-toi : tu entends mieux ce qui fonctionne en réécoutant qu’en jouant."]], "4b": [["Comment choisir ma première chanson ?", "Prends un morceau que tu connais par cœur, avec peu d’accords et un tempo modéré. Trouve les accords et joue d’abord les fondamentales."], ["Comment trouver les accords d’une chanson ?", "Cherche une grille d’accords fiable ou trouve les fondamentales à l’oreille. Compare avec ce que tu entends : mieux vaut essayer et corriger que ne pas essayer."], ["Que faire quand la chanson change de tonalité ?", "Repère la nouvelle fondamentale et déplace tes formes : un arpège garde la même forme dans toutes les tonalités."], ["Comment savoir si ma ligne est bonne ?", "Elle est bonne si elle soutient la chanson : la fondamentale tombe juste, le rythme colle à la batterie, et ça groove. Enregistre-toi pour en juger."]], "s1": [["Debout ou assis ?", "Les deux conviennent. Règle la sangle pour que la basse soit à la même hauteur dans les deux positions : tes mains gardent les mêmes repères."], ["Pourquoi ma main gauche me fait mal ?", "Souvent à cause d’un poignet trop plié ou d’un pouce qui serre. Garde le pouce derrière le manche, les doigts arrondis, et détends la main entre les notes."], ["Où poser le pouce de la main droite ?", "Sur le micro, ou sur la corde plus grave que celle que tu joues. Il sert de point d’appui."], ["Faut-il regarder le manche ?", "Au début, oui. Peu à peu, repère-toi grâce aux cases marquées (3, 5, 7, 9) et regarde de moins en moins."]], "s2": [["Pourquoi alterner deux doigts ?", "Alterner répartit le travail, rend le rythme régulier et évite la fatigue. Utiliser toujours le même doigt te ralentit vite."], ["Quel doigt commencer ?", "L’index sur le temps fort est un bon choix, mais l’important est de rester régulier. Il n’y a pas de règle absolue."], ["Comment alterner en changeant de corde ?", "Continue l’alternance même en changeant de corde. Si tu bloques, ralentis : la régularité passe avant la vitesse."], ["Mon majeur est plus faible, que faire ?", "C’est normal. Travaille très lentement avec le métronome en cherchant le même volume pour les deux doigts."]], "s3": [["Pourquoi jouer seulement les fondamentales ?", "Elles disent au groupe sur quel accord on se trouve. Une ligne simple et juste vaut mieux qu’une ligne compliquée et fausse."], ["Combien de temps par accord ?", "Une mesure de quatre temps par accord, sauf si la chanson change plus vite. Compte jusqu’à 4 à voix haute."], ["Comment passer aux croches ?", "Joue deux notes par temps, sur la même fondamentale. Reste régulier : c’est la même note, juste plus dense."], ["Comment retenir l’ordre des accords ?", "Dis les noms à voix haute en jouant : « Do, La mineur, Fa, Sol ». Le cerveau retient vite une séquence dite à voix haute."]], "g1": [["Quelle différence entre noire, croche et double croche ?", "La noire dure un temps. La croche dure un demi-temps (2 par temps). La double croche dure un quart de temps (4 par temps)."], ["Pourquoi 16 cases ?", "Une mesure de 4 temps contient 16 doubles croches. Chaque case est un seizième de mesure : tu y places une note ou non."], ["Comment rester régulier ?", "Joue avec le métronome et tape du pied à chaque temps. Si tu accélères, ralentis le tempo : la régularité d’abord."], ["Que veut dire 1 e & a ?", "C’est la façon de compter les doubles croches : « 1 » est le temps, « e » le premier quart, « & » (et) le demi-temps, « a » le dernier quart."]], "g2": [["Qu’est-ce qu’une syncope ?", "Une note placée entre les temps, sur un moment faible, qui se prolonge vers le temps fort suivant. Elle crée la sensation de balancement."], ["C’est quoi le motif 3 + 3 + 2 ?", "Huit pas regroupés en 3, 3 et 2, répétés deux fois dans la mesure. On le retrouve dans beaucoup de rythmes afro et latins."], ["Pourquoi les silences comptent autant ?", "Ils laissent respirer le groove. Une note juste après un silence sonne plus fort. Les bons bassistes jouent souvent moins qu’on ne le pense."], ["Comment compter l’anticipation gospel ?", "La note tombe sur le « et » du temps 4, juste avant le temps 1 de l’accord suivant. Compte « 1 et 2 et 3 et 4 et » et place-la sur le dernier « et »."]], "g3": [["C’est quoi une note fantôme ?", "Une note jouée très doucement, presque sans hauteur, en effleurant la corde. Elle marque le rythme sans prendre de place dans le son."], ["Comment jouer une note fantôme ?", "Pose légèrement les doigts de la main gauche sur la corde sans appuyer, et pince doucement avec la main droite. Le son est étouffé, comme un « clac »."], ["À quoi sert la poche ?", "La poche, c’est la sensation que la basse et la batterie jouent ensemble. Les notes fantômes remplissent les silences et rendent la ligne plus vivante."], ["Combien de notes fantômes jouer ?", "Peu au début : une ou deux par mesure. Trop de notes fantômes rendent la ligne confuse."]], "sc1": [["Pourquoi « pentatonique » ?", "Penta veut dire cinq : cette gamme n’a que cinq notes. Sans les notes qui frottent le plus, elle sonne bien sur presque tout."], ["Quelles sont les notes de La pentatonique mineure ?", "La, Do, Ré, Mi, Sol : fondamentale, tierce mineure, quarte, quinte et septième mineure."], ["Comment improviser avec cette gamme ?", "Joue-la sur un accord de La mineur, change l’ordre des notes et reviens souvent sur la fondamentale. Garde un rythme simple."], ["Comment la jouer dans une autre tonalité ?", "La forme est la même partout : décale-la pour que ta fondamentale tombe sur la bonne note. La pentatonique de Sol se joue deux cases plus bas que celle de La."]], "sc2": [["Quelle différence avec la pentatonique mineure ?", "Elle contient la tierce majeure et la sixte : Do Ré Mi Sol La. Elle sonne plus lumineuse et plus ouverte."], ["Pourquoi Do majeur et La mineur ont les mêmes notes ?", "La est le relatif mineur de Do : il se trouve trois demi-tons plus bas. Ce sont les mêmes notes, mais l’oreille entend un centre différent selon celle sur laquelle tu insistes."], ["Quand choisir la majeure ?", "Sur des accords majeurs et des ambiances lumineuses ou apaisées (worship, gospel, pop). Sur des accords mineurs ou du blues, préfère la mineure."], ["Comment ne pas me tromper de gamme ?", "Regarde la tierce de l’accord : si elle est majeure, pars sur la pentatonique majeure. Si elle est mineure, sur la mineure."]], "sc3": [["Que veut dire ton, ton, demi-ton… ?", "La gamme majeure suit la suite d’intervalles ton, ton, demi-ton, ton, ton, ton, demi-ton. Un ton = deux cases, un demi-ton = une case."], ["Pourquoi apprendre les degrés ?", "Les degrés (1 à 7) permettent de comprendre n’importe quelle grille, quelle que soit la tonalité. I, IV et V sont les plus courants."], ["Quelle différence avec la pentatonique majeure ?", "La pentatonique est la gamme majeure sans la quarte (Fa) et la septième (Si). Moins de notes, donc moins de risques de frotter avec l’accord."], ["Comment mémoriser la gamme ?", "Joue-la lentement en disant les degrés à voix haute, puis en partant d’une autre note. Mieux vaut une forme maîtrisée que dix connues à moitié."]], "sc4": [["C’est quoi la blue note ?", "C’est la quinte diminuée, une case au-dessus de la quarte. En La, c’est le Mib. Elle apporte une tension caractéristique."], ["Comment jouer la blue note ?", "En passage : monte de la quarte (Ré) vers la blue note (Mib), puis vers la quinte (Mi). Ne reste pas dessus trop longtemps."], ["Pourquoi ça sonne bluesy ?", "Parce que la tension de la blue note est résolue vers la note suivante. L’oreille entend un « presque faux » qui colle à l’émotion du blues."], ["Pour quels styles la gamme blues ?", "Blues, rock, jazz, soul et même gospel. Elle sert surtout pour les fills et les passages de liaison."]], "h1": [["Que veut dire I, IV, V ?", "Ce sont les degrés de la gamme : le 1er, le 4e et le 5e accord. En Do majeur : Do, Fa, Sol."], ["Pourquoi ces trois accords sont-ils partout ?", "Ensemble, ils contiennent toutes les notes de la gamme et créent un cycle simple : départ (I), mouvement (IV), tension (V), retour (I)."], ["Comment trouver I, IV, V dans une autre tonalité ?", "Compte à partir de la fondamentale : le IV est 5 demi-tons plus haut, le V est 7 demi-tons plus haut. En Sol : Sol, Do, Ré."], ["Pourquoi utiliser des chiffres romains ?", "Parce que le même chiffre vaut pour toutes les tonalités. Un musicien peut dire « on joue I IV V en Sol » sans connaître les notes à l’avance."]], "h2": [["Pourquoi le ii est-il en minuscule ?", "Les chiffres romains en minuscule indiquent un accord mineur. En Do majeur : ii = Ré mineur 7, V = Sol 7, I = Do maj7."], ["Pourquoi cette cadence est-elle si courante ?", "Les trois accords s’enchaînent naturellement : chaque fondamentale descend d’une quinte (Ré, Sol, Do). L’oreille trouve ça logique et satisfaisant."], ["Comment relier ces trois accords ?", "Cherche des notes proches : le Do du Ré mineur 7 descend d’un demi-ton vers le Si du Sol 7, puis ce Si reste dans le Do maj7."], ["Où entendre cette cadence ?", "Dans le jazz, la neo-soul et le gospel moderne, souvent à la fin d’une phrase avant de revenir au début."]], "h3": [["Qu’est-ce que transposer ?", "Rejouer la même musique dans une autre tonalité. Tous les accords se décalent du même nombre de demi-tons."], ["Comment transposer une grille ?", "Calcule l’écart entre les deux fondamentales (de Do à Sol : 7 demi-tons) et décale chaque accord de cet écart. Ou raisonne en degrés : I – IV – V."], ["Les formes d’arpèges changent-elles ?", "Non. Un arpège majeur garde la même forme sur le manche, seul le point de départ change. C’est l’intérêt de connaître les formes."], ["Quand dois-je transposer ?", "Pour s’adapter à une voix : un chanteur peut demander une tonalité plus haute ou plus basse. Le bassiste doit suivre rapidement."]], "GEN": [["Comment progresser plus vite ?", "Pratique peu mais régulièrement, avec le métronome, et réécoute-toi. Quinze minutes régulières valent mieux qu’une heure de temps en temps."], ["Comment utiliser le métronome ?", "Commence lentement (50 à 60 BPM) jusqu’à ce que ce soit parfaitement régulier, puis monte de 5 BPM à la fois. Le métronome est dans l’onglet Outils."], ["Mon son est irrégulier, que faire ?", "Ralentis, détends la main droite et écoute le volume de chaque note : elles doivent avoir la même intensité."], ["Comment accorder ma basse ?", "Utilise l’accordeur dans l’onglet Outils : joue chaque corde à vide et vise le vert. Accorde toujours avant de pratiquer."], ["J’ai mal à la main, que faire ?", "Arrête-toi, détends-toi et vérifie ta posture : poignet droit, épaules basses, pouce derrière le manche. Si la douleur persiste, demande conseil à un professeur ou à un médecin."], ["À quoi sert le bilan de fin de module ?", "Il t’oblige à vérifier si tu maîtrises vraiment la notion : l’expliquer, la jouer, la retrouver ailleurs, l’utiliser en musique, la varier."]]};
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9# ]/g,' ');
const STOP=new Set('le la les un une des de du d l au aux et ou en est ce c qu que qui quoi pour par sur dans avec sans mon ma mes ton ta tes se sa son ses je tu il on nous vous ils elle ne pas plus comment pourquoi quel quelle quels quelles faire fait peut peux dois doit faut y a ca cela si mais donc car'.split(' '));
const toks=s=>norm(s).split(/\s+/).filter(w=>w.length>1&&!STOP.has(w)).map(w=>w.slice(0,5));
const faqOf=l=>FAQ[l.id]||[];
function findFaq(q,l){const qt=new Set(toks(q));if(!qt.size)return null;
const sc=[...faqOf(l).map(x=>[x,1.4]),...FAQ.GEN.map(x=>[x,1])].map(([x,b])=>{const kt=new Set(toks(x[0])),at=new Set(toks(x[1]));let s=0;qt.forEach(w=>{if(kt.has(w))s+=2;else if(at.has(w))s+=.7});return{x,s:s*b/Math.sqrt(1+kt.size*.25)}}).sort((a,b)=>b.s-a.s);
return sc[0].s>=1.8?sc[0]:null}
const NOANS='Je n’ai pas de réponse préparée pour cette question. Essaie une des questions proposées ci-dessus, ou reformule avec les mots de la notion (par exemple « tierce », « arpège », « doigts », « rythme »).';
const chatH=()=>((ui.chat&&ui.chat.id==ui.l)?ui.chat.m:[]).map(m=>`<div class="bub ${m.r=='user'?'u':'a'}">${esc(m.t)}</div>`).join('');
const showChat=()=>{const c=$('#chat');if(!c)return;c.innerHTML=chatH();if(c.lastElementChild)c.lastElementChild.scrollIntoView({block:'nearest',behavior:'smooth'})};
function pushQA(q,a){if(!ui.chat||ui.chat.id!=ui.l)ui.chat={id:ui.l,m:[]};ui.chat.m.push({r:'user',t:q},{r:'assistant',t:a});showChat()}
function ask(q){q=(q||'').trim();if(!q)return;const i=$('#q');if(i)i.value='';const r=findFaq(q,lessonOf());pushQA(q,r?(r.s<3.6?'Je pense que tu parles de : « '+r.x[0]+' »\n\n':'')+r.x[1]:NOANS)}

else if(a=='obnext'){ui.ob++;render();scrollTo(0,0)}else if(a=='obprev'){ui.ob--;render();scrollTo(0,0)}
else if(a=='obx'){setInst(S.pf.n);ui.ob=null;ui.dr=null;render()}
else if(a=='obedit'){ui.ob=0;ui.dr=JSON.parse(JSON.stringify(S.pf));render()}
else if(a=='obdone'){S.pf=ui.dr;S.plan=buildPlan(S.pf);setInst(S.pf.n);ui.ob=null;ui.dr=null;ui.t='home';save();render();toast('Ton parcours est prêt')}
else if(a=='back'){plStop();ui.l=null;ui.t='path';render()}
else if(a=='next')stepTo(ui.k+1);
else if(a=='prev'){if(ui.k==0){plStop();ui.l=null;ui.t='path';render()}else stepTo(ui.k-1)}
else if(a=='grp'){plStop();ui.g=+d.i;drawBoard()}
else if(a=='pn'){const g=cur().g[ui.g],o=g.p[+d.i];tone(o.m,.8);say(o.m,g,o.s,o.f)}
else if(a=='cell'){const s=+d.s,f=+d.f,m=OPEN[s]+f,g=cur().g[ui.g];tone(m,.8);say(m,g,s,f);
const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('class','fl');c.setAttribute('r',11);c.setAttribute('cx',f?32+(f-.5)*30:16);c.setAttribute('cy',+t.getAttribute('y')+13);t.parentNode.appendChild(c);setTimeout(()=>c.remove(),600)}
else if(a=='ref'){const i=+d.i;tone(OPEN[i],1.6);instMark(i,false);const x=$('#tn');if(x&&!tn.on){x.textContent=SN[i];$('#tf').textContent=FQ(OPEN[i]).toFixed(1)+' Hz · corde à vide'}else if(!x)toast(SN[i]+' · '+FQ(OPEN[i]).toFixed(1)+' Hz')}
else if(a=='inst'){setInst(+d.n);render()}
else if(a=='pplay'){if(pl.on)plStop();else{AC();pl.on=true;t.innerHTML=ICS;plTick()}}
else if(a=='ck'){const m=S.mast[ui.l]=S.mast[ui.l]||[0,0,0,0,0];m[+d.i]=m[+d.i]?0:1;save();t.classList.toggle('on',!!m[+d.i]);t.querySelector('i').textContent=m[+d.i]?'✓':''}
else if(a=='done'){const l=lessonOf(),was=trDone(l.tr);S.sess.push({t:Date.now(),id:l.id,min:mins(l)});delete S.res[l.id];save();const nt=nextTodo(l.id),fin=!was&&trDone(l.tr);
if(nt){ui.l=nt.id;stepTo((S.res||{})[nt.id]||0);toast(fin&&nt.tr!=l.tr?'Parcours terminé · « '+TR[nt.tr].n+' » débloqué':'Module terminé · suivant : '+nt.t)}else{ui.l=null;ui.t='path';render();toast('Parcours complet terminé, bravo !')}}
else if(a=='mplay'){if(mt.on)mtStop();else{AC();mt.on=true;mt.i=0;mt.nt=ctx.currentTime+.05;mtRun()}render()}
else if(a=='bm')setBpm(mt.bpm-5);else if(a=='bp')setBpm(mt.bpm+5);
else if(a=='tap'){const n=Date.now();mt.taps=mt.taps.filter(x=>n-x<2000);mt.taps.push(n);if(mt.taps.length>1)setBpm(60000/((n-mt.taps[0])/(mt.taps.length-1)))}
else if(a=='mic'){if(tn.on){tnStop();render()}else{tnStart()}}
else if(a=='sadd'){const g=i=>$('#'+i).value.trim();if(!g('sg-t'))return toast('Ajoute un titre');S.songs.push({id:'s'+Date.now().toString(36),t:g('sg-t'),k:g('sg-k'),p:g('sg-p'),s:0});save();render()}
else if(a=='sst'){const s=S.songs[+d.i];s.s=(s.s+1)%3;save();render()}
else if(a=='sdel'){if(ui.del==d.id){aDel(d.id).catch(()=>0);S.songs=S.songs.filter(s=>s.id!=d.id);ui.del=null;save();render();toast('Chanson supprimée')}else{ui.del=d.id;render();setTimeout(()=>{if(ui.del==d.id){ui.del=null;if(ui.t=='songs'&&ui.l==null)render()}},3500)}}
else if(a=='rrec')recStart(d.id);else if(a=='rstop')recStop();
else if(a=='adel'){aDel(d.id).catch(()=>0);song(d.id).a=0;save();render()}
else if(a=='exp')exportData()});
document.addEventListener('input',e=>{if(e.target.id=='bpm')setBpm(+e.target.value);if(e.target.id=='lb'){ui.bpm=+e.target.value;$('#lbv').textContent=ui.bpm}});
document.addEventListener('change',e=>{const t=e.target;
if(t.id=='beats'){mt.beats=+t.value;mt.i=0;render()}
else if(t.classList.contains('af')&&t.files[0]){const id=t.dataset.id;aPut(id,t.files[0]).then(()=>{song(id).a=1;save();render();toast('Audio ajouté')}).catch(()=>toast('Fichier non enregistré'))}
else if(t.id=='imp'&&t.files[0]){t.files[0].text().then(x=>{try{const o=JSON.parse(x);if(!o||!o.sess)throw 0;S=Object.assign({sess:[],mast:{},songs:[]},o);S.res=S.res||{};if(S.pf)S.plan=buildPlan(S.pf);else{ui.ob=0;ui.dr={lv:'int',n:S.n||5,min:15,days:3,st:[],goal:'varie'}}save();setInst(S.n||5);render();toast('Données importées')}catch(e){toast('Fichier invalide')}})}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='q'){e.preventDefault();ask(e.target.value)}});
['gesturestart','gesturechange'].forEach(g=>document.addEventListener(g,e=>e.preventDefault()));
delete S.key;delete S.model;if(S.pf&&!S.plan.length)S.plan=buildPlan(S.pf);if(!S.pf){ui.ob=0;ui.dr={lv:'int',n:S.n||5,min:15,days:3,st:[],goal:'varie'}}
history.replaceState({bl:0},'');history.pushState({bl:1},'');
addEventListener('popstate',()=>{const keep=()=>history.pushState({bl:1},'');
if(ui.ob!=null){if(ui.ob>0)ui.ob--;else if(S.pf){setInst(S.pf.n);ui.ob=null;ui.dr=null}render();keep();return}
if(ui.l!=null){plStop();ui.l=null;ui.t='path';render();keep();return}
if(ui.t!='home'){leave('home');ui.t='home';render();keep();return}
toast('Appuie encore sur retour pour quitter')});
render();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
