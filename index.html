<style>

.cell{fill:transparent;cursor:pointer}.fl{fill:var(--ac);pointer-events:none;transform-box:fill-box;transform-origin:center;animation:fade .6s forwards}@keyframes fade{to{opacity:0;transform:scale(1.8)}}
.nl{text-align:center;color:var(--mu);font-size:14px;margin-top:10px;min-height:21px}.chip{cursor:pointer}

.sx.t{stroke:var(--ac)}.sx.ok{stroke:var(--ok);animation:vib .1s infinite alternate}.pg.t circle{stroke:var(--ac);stroke-width:3}.pg.ok circle{fill:var(--ok);stroke:var(--ok)}.pg.ok text{fill:#0d0d0f}@keyframes vib{to{transform:translateX(1.5px)}}
.dir{font-weight:650;min-height:24px}.mp{width:200px;display:block;margin:0 auto}.mb{fill:#1f1f24;stroke:#3a3a42}.ma{stroke:#cfcdd2;stroke-width:3;stroke-linecap:round}.mw{fill:var(--ac)}
#arm{transform-origin:100px 132px;transition:transform .5s ease-in-out}
.wave{display:flex;gap:4px;align-items:center;justify-content:center;height:56px;margin-bottom:8px}.wave i{width:4px;border-radius:3px;background:var(--ac);animation:wv 1s ease-in-out infinite alternate}@keyframes wv{to{transform:scaleY(.3)}}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.hm{aspect-ratio:1;border-radius:7px;background:var(--c2)}.hm.h1{background:#7a3a34}.hm.h2{background:var(--ac)}
.rec{display:flex;gap:10px;align-items:center;margin-top:12px}.rec .ghost{margin-left:auto;padding:8px 16px}.rdot{width:12px;height:12px;border-radius:50%;background:#ff4a3d;animation:wv .6s infinite alternate}
.row>.ghost{min-height:50px;display:grid;place-items:center;padding:0 10px}.up{cursor:pointer;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K='basslab.v2';let S;try{S=JSON.parse(localStorage[K])}catch(e){}
S=Object.assign({sess:[],mast:{},songs:[]},S||{});S.n=S.n||5;S.songs.forEach((s,i)=>s.id=s.id||'s'+i+Date.now().toString(36));const save=()=>{try{localStorage[K]=JSON.stringify(S)}catch(e){}};
/* ---------- Théorie & manche (5 cordes : index 0=Si ... 4=Sol) ---------- */
/* ---------- Théorie & manche (4, 5 ou 6 cordes) ---------- */
const BASE5=[23,28,33,38,43],TUN={4:[28,33,38,43],5:[23,28,33,38,43],6:[23,28,33,38,43,48]},NN=['Do','Do#','Ré','Mib','Mi','Fa','Fa#','Sol','Lab','La','Sib','Si'];
let OPEN=TUN[5],SN=[];const ALLG=[];
const DG=['R','♭2','2','♭3','3','4','♭5','5','♭6','6','♭7','7'],deg=d=>d==12?'8':DG[((d%12)+12)%12];
const LET={C:0,D:2,E:4,F:5,G:7,A:9,B:11},nm=n=>{const m=n.match(/^([A-G])([b#]?)(\d)$/);return LET[m[1]]+(m[2]=='#'?1:m[2]=='b'?-1:0)+12*(+m[3]+1)};
function place1(m,a,ps){let b;OPEN.forEach((o,s)=>{const f=m-o;if(f<0||f>9)return;const c=Math.abs(f-a)+(ps>=0?Math.abs(s-ps-1)*.6:0);if(!b||c<b.c)b={s,f,m,c}});return b}
function parse(g){let ps=-1;g.p=g.n.split(' ').map(t=>{const p=t[0]=='~';if(p)t=t.slice(1);let o;
if(/^\d:/.test(t)){const[s,f]=t.split(':').map(Number),i=OPEN.indexOf(BASE5[s]);o=i>=0?{s:i,f,m:OPEN[i]+f}:place1(BASE5[s]+f,f,ps)}else o=place1(nm(t),g.a||0,ps);
if(!o)return null;ps=o.s;return Object.assign({},o,{p})}).filter(Boolean);g.rt=g.r&&nm(g.r)>=OPEN[0]?nm(g.r):g.p[0].m;return g}
const G=(l,n,a,r)=>{const g={l,n,a,r};ALLG.push(g);return parse(g)},S_=(t,m,x,g,b)=>({t,m,x,g,b:b||60});
const setInst=n=>{S.n=n;OPEN=TUN[n];SN=OPEN.map(m=>NN[m%12]);ALLG.forEach(parse);save()};
/* ---------- Parcours ---------- */
const DO=G('Do','C2 E2 G2 C3',3),AM=G('La mineur','A1 C2 E2 A2',0),FA=G('Fa','F1 A1 C2 F2',1),SO=G('Sol','G1 B1 D2 G2',3),PR=[DO,AM,FA,SO];
const P7=[G('Do maj7','C2 E2 G2 B2',3),G('La min7','A1 C2 E2 G2',0),G('Ré min7','D2 F2 A2 C3',3),G('Sol 7','G1 B1 D2 F2',3)];
const WK={1:'Arpèges fondamentaux',2:'Arpèges de septième',3:'Passages et transitions',4:'Création de lignes'};
const L=[
{id:'1a',w:1,t:'Trouver les notes',d:'Le manche de ta 5 cordes',s:[
S_('Les cordes à vide',2,'De la plus grave à la plus aiguë, joue chaque corde à vide, une note par temps. Touche une case du manche pour entendre sa note.',[G('Cordes à vide','B0 E1 A1 D2 G2')],50),
S_('Monter sur la corde de La',4,'Chaque case vaut un demi-ton. Sur la corde de La, les notes naturelles sont aux cases 0, 2, 3, 5, 7 et 8.',[G('Corde de La','2:0 2:2 2:3 2:5 2:7 2:8')],60),
S_('Un Do, quatre endroits',4,'Une même note existe à plusieurs endroits. Retrouve tous les Do : c’est la clé pour ne plus se perdre sur le manche.',[G('Les Do du manche','2:3 1:8 4:5 3:10')],50)]},
{id:'1b',w:1,t:'Arpège majeur',d:'Fondamentale, tierce, quinte, octave',s:[
S_('La formule 1 – 3 – 5 – 8',3,'Un arpège majeur combine la fondamentale, la tierce majeure (4 demi-tons), la quinte (7 demi-tons) et l’octave. Regarde la forme, puis joue avec l’animation.',[G('Do majeur','C2 E2 G2 C3',3)],60),
S_('Do, Fa, Sol',5,'Même formule, trois points de départ. Une note par temps à 60 BPM : cherche un son propre et régulier.',[DO,FA,SO],60)]},
{id:'1c',w:1,t:'Arpège mineur',d:'Entendre la tierce mineure',s:[
S_('Un demi-ton change tout',3,'La tierce mineure est un cran plus bas (3 demi-tons). Compare Do majeur et Do mineur : la couleur devient plus sombre.',[G('Do majeur','C2 E2 G2 C3',3),G('Do mineur','C2 Eb2 G2 C3',3)],60),
S_('La, Ré, Mi mineurs',5,'Formule : fondamentale, tierce mineure, quinte, octave. 60 BPM.',[AM,G('Ré mineur','D2 F2 A2 D3',3),G('Mi mineur','E1 G1 B1 E2',0)],60)]},
{id:'1d',w:1,t:'Do – La mineur – Fa – Sol',d:'Ta première progression',s:[
S_('Passage 1 : les fondamentales',2,'Joue seulement la racine de chaque accord. Toute la progression repose sur ces notes.',[G('Do','C2 C2 C3 C2',3),G('La mineur','A1 A1 A2 A1',0),G('Fa','F1 F1 F2 F1',1),G('Sol','G1 G1 G2 G1',3)],70),
S_('Passage 2 : les arpèges',3,'Remplace chaque racine par l’arpège complet de l’accord.',PR,70),
S_('Passage 3 : ton ordre',3,'Garde ces notes mais change leur ordre, ajoute des silences. Défi : invente deux lignes différentes sur la même progression.',PR,70)]},
{id:'2a',w:2,t:'Maj7 et min7',d:'Deux couleurs douces',s:[
S_('La septième majeure',4,'Maj7 = 1, 3, 5, 7. Un son ouvert et lumineux, typique du worship.',[P7[0],G('Fa maj7','F1 A1 C2 E2',1)],60),
S_('La septième mineure',4,'Min7 = 1, ♭3, 5, ♭7. Plus chaud, très présent en soul et en neo-soul.',[P7[1],P7[2]],60)]},
{id:'2b',w:2,t:'Septième de dominante',d:'La tension qui appelle la suite',s:[
S_('1 – 3 – 5 – ♭7',4,'Le dominant 7 crée de la tension : c’est l’accord du degré V. Écoute comme Sol 7 veut retomber sur Do.',[P7[3],G('Do 7','C2 E2 G2 Bb2',3)],60)]},
{id:'2c',w:2,t:'Progression worship',d:'Cmaj7 – Am7 – Dm7 – G7',s:[
S_('Les quatre accords',5,'Un arpège par mesure. Cherche le chemin le plus court entre la dernière note et la suivante.',P7,70),
S_('Ta version',5,'Change l’ordre, ajoute des silences, garde la fondamentale sur le premier temps.',P7,70)]},
{id:'3a',w:3,t:'Notes de passage',d:'Relier les notes de l’arpège',s:[
S_('Remplir les trous',4,'Une note de passage (en jaune) se place entre deux notes de l’accord, sur un temps faible. Elle ne reste jamais : elle mène vers la suivante.',[G('Do : 1 – 2 – 3 – 5','C2 ~D2 E2 G2',3),G('Do : 3 – 4 – 5 – 6','E2 ~F2 G2 ~A2',3)],70)]},
{id:'3b',w:3,t:'Approches chromatiques',d:'Un demi-ton avant la cible',s:[
S_('Par dessous, par dessus',5,'Joue une note à un demi-ton de la note visée, juste avant elle : la tension se résout aussitôt.',[G('Par dessous','C2 E2 ~F#2 G2',3),G('Par dessus','C2 E2 ~Ab2 G2',3)],70)]},
{id:'3c',w:3,t:'Transitions et anticipations',d:'Enchaîner sans à-coups',s:[
S_('Do vers La mineur',5,'Termine la mesure par une approche de la racine suivante. Anticipation : joue cette racine un demi-temps plus tôt, sur le « et » du dernier temps.',[G('Fin de mesure Do','C2 E2 G2 ~G#1',3),G('Arrivée sur La mineur','A1 C2 E2 A1',0)],70)]},
{id:'4a',w:4,t:'Deux lignes, une progression',d:'Varier notes et rythmes',s:[
S_('Ligne A : simple et groovy',5,'Racine, tierce, quinte. Laisse de l’espace et joue franchement sur les temps.',[G('Do','C2 E2 G2 E2',3),G('La mineur','A1 C2 E2 C2',0),G('Fa','F1 A1 C2 A1',1),G('Sol','G1 B1 D2 B1',3)],70),
S_('Ligne B : plus mélodique',5,'Ajoute des notes de passage et change les rythmes. Compare avec la ligne A.',[G('Do','C2 E2 ~F#2 G2',3),G('La mineur','A1 C2 ~D2 E2',0),G('Fa','F1 A1 ~B1 C2',1),G('Sol','G1 ~A1 B1 D2',3)],70)]},
{id:'4b',w:4,t:'Une vraie chanson',d:'Tout appliquer dans ton répertoire',s:[
S_('Choisis ta chanson',5,'Ajoute une chanson dans l’onglet Chansons. Passage 1 : racines. Passage 2 : arpèges. Passage 3 : ta ligne, avec au moins une note de passage.',[],70),
S_('Évalue-toi',3,'Enregistre-toi avec ton téléphone et réécoute : ta ligne varie-t-elle ? Note ce qui coince.',[],70)]}];

mr.onstop=async()=>{st.getTracks().forEach(t=>t.stop());await aPut(id,new Blob(ch,{type:mr.mimeType||'audio/mp4'}));song(id).a=1;save();rec=null;render();toast('Enregistrement ajouté')};
rec={id,mr,t0:Date.now()};mr.start();rec.iv=setInterval(()=>{const e=$('#rt'),s=Math.floor((Date.now()-rec.t0)/1000);if(e)e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},500);render()}catch(e){toast('Enregistrement impossible ici')}}
const recStop=()=>{if(rec){clearInterval(rec.iv);rec.mr.stop()}};
async function exportData(){const f=new File([JSON.stringify(S)],'basslab-sauvegarde.json',{type:'application/json'});
try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name=='AbortError')return}
const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}
/* ---------- Vues ---------- */
const IC={home:'M4 11l8-7 8 7v9h-5v-6H9v6H4z',path:'M5 19h6a4 4 0 000-8H8a4 4 0 010-8h8',tools:'M8 21l2-17h4l2 17zM12 16l5-8',songs:'M9 18V5l11-2v13M9 18a3 3 0 11-6 0 3 3 0 016 0zM20 16a3 3 0 11-6 0 3 3 0 016 0z',prog:'M5 20V10M12 20V4M19 20v-7'};
const TB=[['home','Accueil'],['path','Parcours'],['tools','Outils'],['songs','Chansons'],['prog','Progrès']];
const week=()=>S.sess.filter(s=>s.t>Date.now()-6048e5).length,ring=p=>`<svg viewBox="0 0 64 64"><circle class="rb" cx="32" cy="32" r="26"/><circle class="rf" cx="32" cy="32" r="26" style="stroke-dasharray:${163*Math.min(p,1)} 163"/></svg>`;
const ovr=()=>L.reduce((a,l)=>a+mp(l.id),0)/L.length;
function homeV(){const h=new Date().getHours(),w=week(),tot=S.sess.reduce((a,s)=>a+s.min,0),nx=L.find(l=>mp(l.id)<1)||L[0],g0=(nx.s.find(s=>s.g.length)||L[0].s[1]).g[0];
return `<div class="hd"><p class="mu">${h<5||h>=18?'Bonsoir':'Bonjour'}</p><h1>On joue un peu ?</h1></div>
<div class="card hero"><p>Prochaine séance · ${mins(nx)} min</p><h2>${nx.t}</h2><p>${nx.d}</p><button class="btn" data-a="open" data-id="${nx.id}">Commencer</button></div>
<div class="card"><p class="gl">Aperçu : ${g0.l}</p>${svgB(g0)}</div>
<div class="card big"><div class="ring">${ring(w/4)}<b>${w}</b></div><div><h3>${w} séance${w>1?'s':''} sur 7 jours</h3><small>Objectif : 3 à 4 séances par semaine</small></div></div>
<div class="stats"><div class="card"><b>${tot}</b><small>minutes</small></div><div class="card"><b>${S.sess.length}</b><small>séances</small></div><div class="card"><b>${Math.round(ovr()*100)}%</b><small>maîtrise</small></div></div>
<div class="card"><div class="sg"><h3>Ma basse</h3><small>${SN.join(' · ')}</small></div><div class="seg2" style="margin-top:10px">${[4,5,6].map(n=>`<button class="${S.n==n?'on':''}" data-a="inst" data-n="${n}">${n} cordes</button>`).join('')}</div>${instV()}<p class="mu cen" style="font-size:14px">Touche une corde pour l’entendre. Les exercices s’adaptent à ton instrument.</p></div>
<h3 style="margin:18px 2px 0">Avant de jouer</h3><div class="row" style="margin-top:8px"><button class="ghost" data-a="tool" data-id="tuner">Accorder la basse</button><button class="ghost" data-a="tool" data-id="metro">Métronome</button></div>`}
let pv=null;const pvStop=()=>{clearInterval(pv);pv=null};
function pvStart(){pvStop();const n=document.querySelectorAll('.nt').length;let j=0;if(n)pv=setInterval(()=>{hl(j%(n+1)==n?-1:j%(n+1));j++},650)}
function pathV(){const dn=L.filter(l=>mp(l.id)==1).length;let h=`<div class="hd"><h1>Parcours</h1><p class="mu">Quatre semaines, du premier arpège à ta propre ligne de basse.</p></div><div class="card big"><div class="ring">${ring(ovr())}<b>${Math.round(ovr()*100)}%</b></div><div><h3>${dn} module${dn>1?'s':''} maîtrisé${dn>1?'s':''} sur ${L.length}</h3><small>La maîtrise vient du bilan, pas du nombre de séances.</small></div></div>`;
[1,2,3,4].forEach(w=>{h+=`<div class="wk"><h3>Semaine ${w}<span>${WK[w]}</span></h3>`+L.filter(l=>l.w==w).map(l=>{const p=mp(l.id),st=l.s.find(s=>s.g.length);return `<div class="card les" data-a="open" data-id="${l.id}"><div class="th">${st?svgB(st.g[0],'m'):'<svg viewBox="0 0 24 24" style="width:100%;height:56px;fill:none;stroke:#8d8d96;stroke-width:1.5;stroke-linecap:round"><path d="'+IC.songs+'"/></svg>'}</div><div style="flex:1;min-width:0"><h3>${l.t}</h3><small>${l.d} · ${mins(l)} min</small><div class="bar"><i style="width:${p*100}%"></i></div></div><b style="color:${p==1?'var(--ok)':'var(--mu)'}">${Math.round(p*100)}%</b></div>`}).join('')+'</div>'});return h}
function toolsV(){let h=`<div class="hd"><h1>Outils</h1></div><div class="seg2"><button class="${ui.tl=='metro'?'on':''}" data-a="tool" data-id="metro">Métronome</button><button class="${ui.tl=='tuner'?'on':''}" data-a="tool" data-id="tuner">Accordeur</button></div>`;
if(ui.tl=='metro')return h+`<div class="card cen"><svg class="mp" viewBox="0 0 200 150"><path class="mb" d="M62 142L78 18h44l16 124z"/><g id="arm" style="transform:rotate(${mt.on?mt.dir*24:0}deg)"><line class="ma" x1="100" y1="132" x2="100" y2="22"/><rect class="mw" id="mw" x="90" y="${28+(mt.bpm-30)/170*60}" width="20" height="16" rx="4"/></g></svg>
<div class="num" id="bpmv">${mt.bpm}</div><p class="mu" id="tmp">${tmpo(mt.bpm)} · BPM</p><div class="dots">${[...Array(mt.beats)].map(()=>'<i class="dot"></i>').join('')}</div><input type="range" id="bpm" min="30" max="200" value="${mt.bpm}">
<div class="row3"><button class="rd" data-a="bm">${MI}</button><button class="play" data-a="mplay">${mt.on?ICS:ICP}</button><button class="rd" data-a="bp">${PL}</button></div>
<div class="row" style="margin-top:18px"><button class="ghost" data-a="tap">Tap tempo</button><select id="beats">${[2,3,4,5,6,7].map(n=>`<option value="${n}" ${n==mt.beats?'selected':''}>${n} temps</option>`).join('')}</select></div></div>`;
return h+`<div class="card cen"><div class="tnn" id="tn">–</div><p class="mu" id="tf">Active le micro et joue une corde</p><p class="dir" id="td">Joue une corde à vide</p><div class="mtr" id="mtr"><i style="left:50%"></i></div><div class="sg"><small>Trop grave</small><small>Juste</small><small>Trop aigu</small></div><button class="btn" id="mic" data-a="mic" style="margin-top:14px">${tn.on?'Arrêter le micro':'Activer le micro'}</button></div>
<div class="card">${instV()}<p class="mu cen" style="font-size:14px">Touche une corde ou une clé pour entendre sa note. La corde jouée s’allume en orange, puis passe au vert quand elle est juste (±5 cents).</p></div>`}
const ST=['À apprendre','En cours','Maîtrisée'];
function songsV(){return `<div class="hd"><h1>Chansons</h1><p class="mu">Ton répertoire à travailler.</p></div><div class="card"><input type="text" id="sg-t" placeholder="Titre de la chanson"><div class="row" style="margin-top:8px"><input type="text" id="sg-k" placeholder="Tonalité"><input type="text" id="sg-p" placeholder="Accords"></div><button class="btn" style="margin-top:10px" data-a="sadd">Ajouter</button></div>`
+(S.songs.length?S.songs.map((s,i)=>`<div class="card"><div class="sg"><div><h3>${esc(s.t)}</h3><small>${esc(s.k||'')} ${esc(s.p||'')}</small></div>${ui.del==s.id?`<button class="tag dang" data-a="sdel" data-id="${s.id}">Supprimer ?</button>`:`<button class="ib" data-a="sdel" data-id="${s.id}">${MI.replace('M5 12h14','M6 6l12 12M18 6L6 18')}</button>`}</div>
${rec&&rec.id==s.id?`<div class="rec"><i class="rdot"></i><b id="rt">0:00</b><span class="mu">Enregistrement en cours</span><button class="ghost" data-a="rstop">Arrêter</button></div>`:`${s.a?`<audio controls id="au-${s.id}" style="width:100%;margin-top:12px"></audio>`:''}<div class="row" style="margin-top:12px"><button class="ghost" data-a="rrec" data-id="${s.id}">Enregistrer</button><label class="ghost up">${s.a?'Remplacer':'Importer'}<input type="file" class="af" accept="audio/*" data-id="${s.id}" hidden></label></div>${s.a?`<button class="tag" style="margin-top:10px" data-a="adel" data-id="${s.id}">Retirer l’audio</button> `:''}`}
<button class="tag s${s.s}" style="margin-top:10px" data-a="sst" data-i="${i}">${ST[s.s]}</button></div>`).join(''):`<div class="card cen">${wave()}<h3>Ta première chanson</h3><p class="mu">Ajoute un morceau, puis enregistre-toi ou importe un audio pour comparer tes progrès.</p></div>`)}
const d0=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
function progV(){const days=[...Array(7)].map((_,i)=>{const d=d0(Date.now())-(6-i)*864e5;return{l:'DLMMJVS'[new Date(d).getDay()],m:S.sess.filter(s=>d0(s.t)==d).reduce((a,s)=>a+s.min,0)}}),mx=Math.max(15,...days.map(d=>d.m));
const heat=[...Array(28)].map((_,i)=>{const d=d0(Date.now())-(27-i)*864e5,m=S.sess.filter(s=>d0(s.t)==d).reduce((a,s)=>a+s.min,0);return `<i class="hm ${m?m>20?'h2':'h1':''}"></i>`}).join('');
let st=0,dd=d0(Date.now());if(!S.sess.some(s=>d0(s.t)==dd))dd-=864e5;while(S.sess.some(s=>d0(s.t)==dd)){st++;dd-=864e5}
return `<div class="hd"><h1>Progrès</h1></div><div class="card"><div class="sg"><h3>Minutes de pratique</h3><small>7 derniers jours</small></div><div class="cols">${days.map(d=>`<div><i style="height:${d.m/mx*60}px"></i>${d.l}</div>`).join('')}</div></div>
<div class="card"><div class="sg"><h3>Régularité</h3><small>${st} jour${st>1?'s':''} d’affilée</small></div><div class="heat" style="margin-top:12px">${heat}</div></div>
<div class="card"><h3>Maîtrise par semaine</h3>${[1,2,3,4].map(w=>{const ls=L.filter(l=>l.w==w),p=ls.reduce((a,l)=>a+mp(l.id),0)/ls.length;return `<div style="margin-top:12px"><div class="sg"><small>Semaine ${w} – ${WK[w]}</small><small>${Math.round(p*100)}%</small></div><div class="bar"><i style="width:${p*100}%"></i></div></div>`}).join('')}</div>
<div class="card"><h3>Historique</h3>${S.sess.length?S.sess.slice(-8).reverse().map(s=>`<div class="sg" style="padding:8px 0;border-bottom:1px solid var(--ln)"><span>${esc((L.find(l=>l.id==s.id)||{t:'Séance'}).t)}</span><small>${new Date(s.t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})} · ${s.min} min</small></div>`).join(''):`<div class="cen">${wave()}<p class="mu">Ta première séance apparaîtra ici.</p></div>`}</div>
<div class="card"><h3>Sauvegarde</h3><p class="mu" style="font-size:14px;margin:4px 0 12px">Tes progrès restent sur cet appareil. Exporte-les avant de changer de téléphone, puis importe le fichier sur le nouveau. Les audios de chansons ne sont pas inclus.</p><div class="row"><button class="ghost" data-a="exp">Exporter</button><label class="ghost up">Importer<input type="file" id="imp" accept=".json,application/json" hidden></label></div></div>`}
function render(){const v=$('#view');document.body.classList.toggle('lesson',ui.l!=null);
v.innerHTML=ui.l!=null?lessonV():({home:homeV,path:pathV,tools:toolsV,songs:songsV,prog:progV})[ui.t]();
$('#tabs').innerHTML=TB.map(([k,n])=>`<button class="${ui.t==k?'on':''}" data-a="tab" data-id="${k}"><svg viewBox="0 0 24 24"><path d="${IC[k]}"/></svg>${n}</button>`).join('');
v.classList.remove('in');void v.offsetWidth;v.classList.add('in');
if(ui.l!=null&&ui.k<lessonOf().s.length)drawBoard();
if((ui.l!=null&&(lessonOf().s[ui.k]||{}).intro)||(ui.l==null&&ui.t=='home'))pvStart();else pvStop();
if(ui.l==null&&ui.t=='songs')S.songs.filter(s=>s.a).forEach(s=>aGet(s.id).then(b=>{const e=$('#au-'+s.id);if(b&&e)e.src=URL.createObjectURL(b)}))}
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1900)};
function stepTo(k){plStop();ui.k=k;ui.g=0;const l=lessonOf();if(k<l.s.length)ui.bpm=l.s[k].b;render();scrollTo(0,0)}
function leave(to){plStop();tnStop();pvStop();recStop();if(to!='tools')mtStop()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,d=t.dataset;
if(a=='tab'){leave(d.id);ui.t=d.id;ui.l=null;render()}
else if(a=='tool'){leave('tools');ui.t='tools';ui.tl=d.id;ui.l=null;render()}
else if(a=='open'){leave('lesson');ui.l=d.id;stepTo(0)}
else if(a=='back'){plStop();ui.l=null;render()}
else if(a=='next')stepTo(ui.k+1);
else if(a=='prev'){if(ui.k==0){plStop();ui.l=null;render()}else stepTo(ui.k-1)}
else if(a=='grp'){plStop();ui.g=+d.i;drawBoard()}
else if(a=='pn'){const g=cur().g[ui.g],o=g.p[+d.i];tone(o.m,.8);say(o.m,g,o.s,o.f)}
else if(a=='cell'){const s=+d.s,f=+d.f,m=OPEN[s]+f,g=cur().g[ui.g];tone(m,.8);say(m,g,s,f);
const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('class','fl');c.setAttribute('r',11);c.setAttribute('cx',f?32+(f-.5)*30:16);c.setAttribute('cy',+t.getAttribute('y')+13);t.parentNode.appendChild(c);setTimeout(()=>c.remove(),600)}
else if(a=='ref'){const i=+d.i;tone(OPEN[i],1.6);instMark(i,false);const x=$('#tn');if(x&&!tn.on){x.textContent=SN[i];$('#tf').textContent=FQ(OPEN[i]).toFixed(1)+' Hz · corde à vide'}else if(!x)toast(SN[i]+' · '+FQ(OPEN[i]).toFixed(1)+' Hz')}
else if(a=='inst'){setInst(+d.n);render()}
else if(a=='pplay'){if(pl.on)plStop();else{AC();pl.on=true;t.innerHTML=ICS;plTick()}}
else if(a=='ck'){const m=S.mast[ui.l]=S.mast[ui.l]||[0,0,0,0,0];m[+d.i]=m[+d.i]?0:1;save();const y=scrollY;render();scrollTo(0,y)}
else if(a=='done'){S.sess.push({t:Date.now(),id:ui.l,min:mins(lessonOf())});save();ui.l=null;ui.t='home';render();toast('Séance enregistrée')}
else if(a=='mplay'){if(mt.on)mtStop();else{AC();mt.on=true;mt.i=0;mt.nt=ctx.currentTime+.05;mtRun()}render()}
else if(a=='bm')setBpm(mt.bpm-5);else if(a=='bp')setBpm(mt.bpm+5);
else if(a=='tap'){const n=Date.now();mt.taps=mt.taps.filter(x=>n-x<2000);mt.taps.push(n);if(mt.taps.length>1)setBpm(60000/((n-mt.taps[0])/(mt.taps.length-1)))}
else if(a=='mic'){if(tn.on){tnStop();render()}else{tnStart()}}
else if(a=='sadd'){const g=i=>$('#'+i).value.trim();if(!g('sg-t'))return toast('Ajoute un titre');S.songs.push({id:'s'+Date.now().toString(36),t:g('sg-t'),k:g('sg-k'),p:g('sg-p'),s:0});save();render()}
else if(a=='sst'){const s=S.songs[+d.i];s.s=(s.s+1)%3;save();render()}
else if(a=='sdel'){if(ui.del==d.id){aDel(d.id).catch(()=>0);S.songs=S.songs.filter(s=>s.id!=d.id);ui.del=null;save();render();toast('Chanson supprimée')}else{ui.del=d.id;render();setTimeout(()=>{if(ui.del==d.id){ui.del=null;if(ui.t=='songs'&&ui.l==null)render()}},3500)}}
else if(a=='rrec')recStart(d.id);else if(a=='rstop')recStop();
else if(a=='adel'){aDel(d.id).catch(()=>0);song(d.id).a=0;save();render()}
else if(a=='exp')exportData()});
document.addEventListener('input',e=>{if(e.target.id=='bpm')setBpm(+e.target.value);if(e.target.id=='lb'){ui.bpm=+e.target.value;$('#lbv').textContent=ui.bpm}});
document.addEventListener('change',e=>{const t=e.target;
if(t.id=='beats'){mt.beats=+t.value;mt.i=0;render()}
else if(t.classList.contains('af')&&t.files[0]){const id=t.dataset.id;aPut(id,t.files[0]).then(()=>{song(id).a=1;save();render();toast('Audio ajouté')}).catch(()=>toast('Fichier non enregistré'))}
else if(t.id=='imp'&&t.files[0]){t.files[0].text().then(x=>{try{const o=JSON.parse(x);if(!o||!o.sess)throw 0;S=Object.assign({sess:[],mast:{},songs:[]},o);save();setInst(S.n||5);render();toast('Données importées')}catch(e){toast('Fichier invalide')}})}});
['gesturestart','gesturechange'].forEach(g=>document.addEventListener(g,e=>e.preventDefault()));
render();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
